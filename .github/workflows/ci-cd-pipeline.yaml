name: NYC Taxi CI-CD Pipeline (6-Hour Scheduler)

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_azure:
        description: Run live ingestion and upload outputs to Azure Blob Storage
        type: boolean
        required: true
        default: true
      dataset_id:
        description: NYC Open Data Trips Dataset ID
        type: choice
        options:
          - 4b4i-vvec
          - rwwi-khbc
        default: 4b4i-vvec
      batch_limit:
        description: Batch limit ($limit)
        type: string
        default: "25000"
      batch_offset:
        description: Batch offset ($offset)
        type: string
        default: "0"
  schedule:
    - cron: "0 */6 * * *"

jobs:
  ci-test:
    name: CI - Test & Fixture Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Unit and Integration Tests
        run: pytest -v

      - name: Run Fixture Pipeline & Validate Contract
        run: |
          python -m src.pipeline fixture \
            --output-dir artifacts/ci_fixture \
            --summary-markdown "$GITHUB_STEP_SUMMARY"

      - name: Upload CI Fixture Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyc-taxi-ci-fixture-output
          path: artifacts/ci_fixture

  cd-ingest-upload:
    name: CD - Live Ingestion & Upload to Azure Blob
    needs: ci-test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_azure == true)
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Batch Parameters
        id: batch
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "dataset_id=${{ inputs.dataset_id }}" >> "$GITHUB_OUTPUT"
            echo "limit=${{ inputs.batch_limit }}" >> "$GITHUB_OUTPUT"
            echo "offset=${{ inputs.batch_offset }}" >> "$GITHUB_OUTPUT"
          else
            OFFSET=$(( (GITHUB_RUN_NUMBER - 1) * 25000 ))
            echo "dataset_id=4b4i-vvec" >> "$GITHUB_OUTPUT"
            echo "limit=25000" >> "$GITHUB_OUTPUT"
            echo "offset=${OFFSET}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Live NYC Taxi Ingestion
        run: |
          python -m src.pipeline live \
            --dataset-id "${{ steps.batch.outputs.dataset_id }}" \
            --limit "${{ steps.batch.outputs.limit }}" \
            --offset "${{ steps.batch.outputs.offset }}" \
            --output-dir artifacts/live_output \
            --summary-markdown "$GITHUB_STEP_SUMMARY"

      - name: Upload Live Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyc-taxi-live-output-${{ github.run_number }}
          path: artifacts/live_output

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload Outputs to Azure Blob Storage
        run: |
          python -m src.upload_blob \
            --account "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --container "${{ vars.AZURE_STORAGE_CONTAINER }}" \
            --input-dir artifacts/live_output \
            --run-id "run_${{ github.run_number }}_${{ github.run_id }}"

      - name: Verify Blobs in Azure Storage
        run: |
          az storage blob list \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --container-name "${{ vars.AZURE_STORAGE_CONTAINER }}" \
            --auth-mode login \
            --query "[].{name:name, size:properties.contentLength, lastModified:properties.lastModified}" \
            --output table
